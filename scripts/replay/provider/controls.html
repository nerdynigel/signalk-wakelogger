<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sailing replay</title>
<style>
body{font:16px system-ui;background:#102c3b;color:#fff;max-width:680px;margin:40px auto;padding:20px}h1{margin-bottom:8px}a{color:#8de0f0}nav{display:flex;gap:24px;margin:28px 0}button{font:inherit;padding:14px 22px;border:0;border-radius:8px;cursor:pointer;background:#8de0f0;color:#102c3b}button:disabled{opacity:.5;cursor:default}#pause,#stop{background:#254b5e;color:#fff}#actions{display:flex;flex-wrap:wrap;gap:12px}progress{width:100%;height:12px;margin-top:24px}#status{font-size:20px;margin-bottom:8px}dialog{box-sizing:border-box;width:min(360px,calc(100vw - 32px));border:0;border-radius:12px;max-width:360px;padding:24px;background:#fff;color:#102c3b}dialog::backdrop{background:#0009}dialog .confirm-actions{display:flex;flex-wrap:wrap;gap:12px}dialog h2{width:100%;font-size:22px;margin-top:0}#error{color:#ffb3a8;white-space:pre-wrap}.muted{color:#b6cbd4}
</style>
<h1>Sailing replay</h1>
<p class="muted">28 June 2026 · 20 minutes · original sailing instruments</p>
<nav><a href="__WEB_URL__" target="_blank" rel="noopener">Open test website</a><a href="/signalk-wakelogger/" target="_blank" rel="noopener">Open onboard app</a></nav>
<p id="status" role="status">Connecting…</p>
<p id="live" class="muted"></p>
<div id="actions"><button id="start" disabled>Start test</button><button id="pause" disabled>Pause</button><button id="stop" disabled>Stop and save</button><button id="restart" disabled>Restart test</button></div>
<progress id="progress" value="0" max="1" aria-label="Replay progress"></progress>
<p id="clock" class="muted"></p>
<p id="error" role="alert"></p>
<dialog id="confirm-start" aria-labelledby="confirm-title"><div class="confirm-actions"><h2 id="confirm-title">Start test replay?</h2><button type="button" id="confirm-cancel">Cancel</button><button type="button" id="confirm-enable">Start and enable Live tracking</button></div></dialog>
<script src="/plugins/wakelogger-real-trip-replay/controls.js"></script>
</html>
